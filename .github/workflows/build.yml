name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-$undefined
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Resolve Fabric versions
        id: versions
        run: |
          set +e
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          LOADER=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          API=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+$MC</version>" | tail -n1 | sed -e 's/<version>//' -e 's#</version>##')
          ARGS=""
          if [ -n "$LOADER" ] && [ "$LOADER" != "null" ]; then ARGS="$ARGS -Ploader_version=$LOADER"; fi
          if [ -n "$API" ]; then ARGS="$ARGS -Pfabric_api_version=$API"; fi
          echo "Minecraft $MC | loader: $LOADER | fabric-api: $API"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Build
        run: gradle build --stacktrace --no-daemon $undefined

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mediaplayer-jar
          path: build/libs/*.jar

      - name: Publish release
        env:
          GH_TOKEN: $undefined
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          TAG="build-$undefined"
          gh release create "$TAG" "$JAR" --title "Media Player $TAG (Minecraft 26.2 Fabric)" --notes "Automated build of commit $undefined. Requires Fabric Loader and Fabric API for Minecraft 26.2." --latest
